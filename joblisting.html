<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listings - JobPortal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .jobs-header {
            background: linear-gradient(135deg, var(--gray-900) 0%, var(--primary-dark) 100%);
            padding: 40px 0;
            color: white;
        }

        .jobs-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .jobs-header p {
            opacity: 0.8;
            margin-bottom: 32px;
        }

        .search-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-input-wrapper svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
        }

        .filter-select {
            min-width: 180px;
            padding: 14px 16px;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            background: white;
            cursor: pointer;
        }

        .jobs-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .results-count {
            font-size: 14px;
            color: var(--gray-600);
        }

        .sort-select {
            padding: 8px 12px;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius);
            font-size: 14px;
            background: white;
        }

        .jobs-grid {
            display: grid;
            gap: 20px;
        }

        .job-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .job-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .job-card-header {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .company-logo {
            width: 56px;
            height: 56px;
            background: var(--gray-100);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .job-card-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 4px;
        }

        .company-name {
            font-size: 14px;
            color: var(--gray-600);
        }

        .job-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .job-badge {
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500;
        }

        .badge-new {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .badge-hot {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .badge-urgent {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .job-details {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-100);
        }

        .job-detail {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--gray-600);
        }

        .job-detail svg {
            width: 16px;
            height: 16px;
            color: var(--gray-400);
        }

        .job-description {
            font-size: 14px;
            color: var(--gray-600);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .job-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .salary-range {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-900);
        }

        .job-actions {
            display: flex;
            gap: 8px;
        }

        .job-actions .btn {
            padding: 10px 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .job-modal {
            background: var(--white);
            border-radius: var(--radius-xl);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .job-modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 1;
        }

        .modal-header-content {
            display: flex;
            gap: 16px;
        }

        .modal-company-logo {
            width: 72px;
            height: 72px;
            background: var(--gray-100);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            color: var(--primary);
        }

        .modal-title h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 4px;
        }

        .modal-title p {
            font-size: 15px;
            color: var(--gray-600);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border: none;
            background: var(--gray-100);
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .modal-close:hover {
            background: var(--gray-200);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-section {
            margin-bottom: 24px;
        }

        .modal-section h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: 12px;
        }

        .modal-section p {
            font-size: 14px;
            color: var(--gray-600);
            line-height: 1.7;
        }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-tag {
            padding: 6px 12px;
            background: var(--gray-100);
            border-radius: var(--radius-full);
            font-size: 13px;
            color: var(--gray-700);
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--gray-200);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            position: sticky;
            bottom: 0;
            background: var(--white);
        }

        .no-jobs {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: var(--radius-lg);
        }

        .no-jobs svg {
            width: 80px;
            height: 80px;
            color: var(--gray-300);
            margin-bottom: 20px;
        }

        .no-jobs h3 {
            font-size: 20px;
            color: var(--gray-700);
            margin-bottom: 8px;
        }

        .no-jobs p {
            color: var(--gray-500);
        }

        @media (max-width: 768px) {
            .search-filters {
                flex-direction: column;
            }

            .filter-select {
                width: 100%;
            }

            .job-card-footer {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }

            .job-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="nav-header">
        <div class="nav-container">
            <a href="home.html" class="nav-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>

                JobPortal

            <nav class="nav-links">

            </nav>

            </div>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="jobs-header">
            <div class="container">
                <h1>Find Your Dream Job</h1>
                <p>Discover opportunities from top companies worldwide</p>
                <div class="search-filters">
                    <div class="search-input-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Job title, keywords, or company..." oninput="filterJobs()">
                    </div>
                    <select class="filter-select form-select" id="locationFilter" onchange="filterJobs()">
                        <option value="">All Locations</option>
                        <option value="Mumbai">Mumbai</option>
                        <option value="Bangalore">Bangalore</option>
                        <option value="Delhi">Delhi</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Pune">Pune</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Remote">Remote</option>
                    </select>
                    <select class="filter-select form-select" id="typeFilter" onchange="filterJobs()">
                        <option value="">Job Type</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Internship">Internship</option>
                        <option value="Contract">Contract</option>
                    </select>
                    <select class="filter-select form-select" id="salaryFilter" onchange="filterJobs()">
                        <option value="">Salary Range</option>
                        <option value="0-5">0 - 5 LPA</option>
                        <option value="5-10">5 - 10 LPA</option>
                        <option value="10-20">10 - 20 LPA</option>
                        <option value="20+">20+ LPA</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="jobs-content">
            <div class="results-header">
                <span class="results-count" id="resultsCount">Showing 0 jobs</span>
                <select class="sort-select" id="sortSelect" onchange="filterJobs()">
                    <option value="newest">Newest First</option>
                    <option value="salary-high">Salary: High to Low</option>
                    <option value="salary-low">Salary: Low to High</option>
                </select>
            </div>

            <div class="jobs-grid" id="jobsGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="jobModal">
        <div class="job-modal">
            <div class="modal-header">
                <div class="modal-header-content">
                    <div class="modal-company-logo" id="modalLogo">JP</div>
                    <div class="modal-title">
                        <h2 id="modalTitle">Job Title</h2>
                        <p id="modalCompany">Company Name</p>
                    </div>
                </div>
                <button class="modal-close" onclick="closeModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px;">
                        <div class="job-detail">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <span id="modalLocation">Location</span>
                        </div>
                        <div class="job-detail">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="1" x2="12" y2="23"></line>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                            </svg>
                            <span id="modalSalary">Salary</span>
                        </div>
                        <div class="job-detail">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                            </svg>
                            <span id="modalType">Job Type</span>
                        </div>
                    </div>
                </div>
                <div class="modal-section">
                    <h4>Job Description</h4>
                    <p id="modalDescription">Description</p>
                </div>
                <div class="modal-section">
                    <h4>Requirements</h4>
                    <p id="modalRequirements">Requirements</p>
                </div>
                <div class="modal-section">
                    <h4>Skills Required</h4>
                    <div class="modal-tags" id="modalSkills"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button class="btn btn-primary" id="modalApplyBtn">Apply Now</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let allJobs = [];
        let currentJob = null;
        let studentProfile = {};

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function loadJobs() {
            studentProfile = JSON.parse(localStorage.getItem('studentProfile') || '{}');
            allJobs = JSON.parse(localStorage.getItem('jobs') || '[]');
            
            if (allJobs.length === 0) {
                initializeSampleJobs();
                allJobs = JSON.parse(localStorage.getItem('jobs') || '[]');
            }
            
            filterJobs();
        }

        function initializeSampleJobs() {
            const sampleJobs = [
                {
                    title: "Frontend Developer",
                    company: "TechCorp India",
                    location: "Bangalore",
                    salary: "8-12 LPA",
                    type: "Full-time",
                    description: "We are looking for a skilled Frontend Developer to join our dynamic team. You will be responsible for building user interfaces using React and modern web technologies.",
                    requirements: "3+ years of experience in React, strong JavaScript skills, experience with responsive design",
                    skills: ["React", "JavaScript", "CSS", "HTML", "TypeScript"],
                    isNew: true
                },
                {

                    location: "Mumbai",
                    salary: "15-20 LPA",
                    type: "Full-time",
                    description: "Join our engineering team to build scalable backend services and APIs. Work with cutting-edge technologies in a fast-paced environment.",
                    requirements: "4+ years of experience, proficiency in Python or Node.js, database design skills",
                    skills: ["Python", "Node.js", "PostgreSQL", "AWS", "Docker"],
                    isNew: true,
                    isHot: true
                },
                {
                    title: "UI/UX Designer",
                    company: "DesignStudio",
                    location: "Remote",
                    salary: "6-10 LPA",

                    requirements: "2+ years of design experience, proficiency in Figma, strong portfolio",

                },
                {

                    company: "DataDriven",
                    location: "Hyderabad",
                    salary: "12-18 LPA",
                    type: "Full-time",
                    description: "Apply machine learning and statistical analysis to solve complex business problems. Work with large datasets and build predictive models.",
                    requirements: "MS/PhD in related field, experience with ML frameworks, strong Python skills",
                    skills: ["Python", "Machine Learning", "TensorFlow", "SQL", "Statistics"],
                    isHot: true
                },
                {
                    title: "DevOps Engineer",
                    company: "CloudFirst",
                    location: "Pune",
                    salary: "10-15 LPA",
                    type: "Full-time",
                    description: "Build and maintain CI/CD pipelines, manage cloud infrastructure, and ensure system reliability and performance.",
                    requirements: "3+ years in DevOps, experience with Kubernetes, AWS/Azure, infrastructure as code",
                    skills: ["AWS", "Kubernetes", "Docker", "Jenkins", "Terraform"],
                    isUrgent: true
                },
                {
                    title: "Marketing Intern",
                    company: "GrowthLabs",
                    location: "Delhi",
                    salary: "15,000 - 25,000/month",
                    type: "Internship",
                    description: "Learn digital marketing strategies and help execute campaigns across various platforms. Great opportunity for freshers.",
                    requirements: "Currently pursuing degree, excellent communication skills, eagerness to learn",
                    skills: ["Social Media", "Content Writing", "Analytics", "Communication"]
                },
                {
                    title: "Backend Developer",
                    company: "ScaleUp Inc",
                    location: "Bangalore",
                    salary: "10-14 LPA",
                    type: "Full-time",
                    description: "Build robust backend systems and APIs for our growing platform. Work with microservices architecture and modern frameworks.",
                    requirements: "3+ years experience, Java/Spring or Node.js expertise, database knowledge",
                    skills: ["Java", "Spring Boot", "Node.js", "MongoDB", "Redis"]
                },
                {
                    title: "Product Manager",
                    company: "StartupXYZ",
                    location: "Mumbai",
                    salary: "20-30 LPA",
                    type: "Full-time",
                    description: "Lead product strategy and roadmap. Work closely with engineering, design, and business teams to deliver impactful products.",
                    requirements: "5+ years in product management, strong analytical skills, MBA preferred",
                    skills: ["Product Strategy", "Agile", "Analytics", "Communication", "Leadership"],
                    isHot: true
                }
            ];
            
            localStorage.setItem('jobs', JSON.stringify(sampleJobs));
        }

        function filterJobs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const locationFilter = document.getElementById('locationFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;
            const salaryFilter = document.getElementById('salaryFilter').value;
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = allJobs.filter(job => {
                const matchesSearch = !searchTerm || 
                    job.title.toLowerCase().includes(searchTerm) ||
                    job.company.toLowerCase().includes(searchTerm) ||
                    (job.skills && job.skills.some(s => s.toLowerCase().includes(searchTerm)));
                
                const matchesLocation = !locationFilter || job.location === locationFilter;
                const matchesType = !typeFilter || job.type === typeFilter;
                
                let matchesSalary = true;
                if (salaryFilter) {
                    const salaryNum = parseFloat(job.salary);
                    if (salaryFilter === "0-5") matchesSalary = salaryNum <= 5;
                    else if (salaryFilter === "5-10") matchesSalary = salaryNum > 5 && salaryNum <= 10;
                    else if (salaryFilter === "10-20") matchesSalary = salaryNum > 10 && salaryNum <= 20;
                    else if (salaryFilter === "20+") matchesSalary = salaryNum > 20;
                }

                return matchesSearch && matchesLocation && matchesType && matchesSalary;
            });

            if (sortBy === "salary-high") {
                filtered.sort((a, b) => parseFloat(b.salary) - parseFloat(a.salary));
            } else if (sortBy === "salary-low") {
                filtered.sort((a, b) => parseFloat(a.salary) - parseFloat(b.salary));
            }

            document.getElementById('resultsCount').textContent = `Showing ${filtered.length} job${filtered.length !== 1 ? 's' : ''}`;
            renderJobs(filtered);
        }

        function renderJobs(jobs) {
            const grid = document.getElementById('jobsGrid');
            
            if (jobs.length === 0) {
                grid.innerHTML = `
                    <div class="no-jobs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </svg>
                        <h3>No jobs found</h3>
                        <p>Try adjusting your search filters</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = jobs.map((job, index) => {
                const isApplied = hasApplied(job);
                const isSaved = checkSaved(job);
                const initials = job.company.split(' ').map(w => w[0]).join('').substring(0, 2);
                
                return `
                    <div class="job-card" onclick="openModal(${index})">
                        <div class="job-card-header">
                            <div class="company-logo">${initials}</div>
                            <div>
                                <h3>${job.title}</h3>
                                <p class="company-name">${job.company}</p>
                            </div>
                        </div>
                        <div class="job-badges">
                            ${job.isNew ? '<span class="job-badge badge-new">New</span>' : ''}
                            ${job.isHot ? '<span class="job-badge badge-hot">Hot</span>' : ''}
                            ${job.isUrgent ? '<span class="job-badge badge-urgent">Urgent</span>' : ''}
                        </div>
                        <div class="job-details">
                            <div class="job-detail">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                    <circle cx="12" cy="10" r="3"></circle>
                                </svg>
                                ${job.location}
                            </div>
                            <div class="job-detail">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                </svg>
                                ${job.type}
                            </div>
                        </div>
                        <p class="job-description">${job.description}</p>
                        <div class="job-card-footer">
                            <span class="salary-range">${job.salary}</span>
                            <div class="job-actions">
                                <button class="btn ${isApplied ? 'btn-secondary' : 'btn-success'} btn-sm" onclick="event.stopPropagation(); toggleApply(${index})">
                                    ${isApplied ? 'Applied' : 'Apply'}
                                </button>
                                <button class="btn ${isSaved ? 'btn-danger' : 'btn-warning'} btn-sm" onclick="event.stopPropagation(); toggleSave(${index})">
                                    ${isSaved ? 'Saved' : 'Save'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(index) {
            const jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const locationFilter = document.getElementById('locationFilter').value;
            
            let filtered = allJobs.filter(job => {
                const matchesSearch = !searchTerm || 
                    job.title.toLowerCase().includes(searchTerm) ||
                    job.company.toLowerCase().includes(searchTerm);
                const matchesLocation = !locationFilter || job.location === locationFilter;
                return matchesSearch && matchesLocation;
            });

            currentJob = filtered[index];
            
            document.getElementById('modalLogo').textContent = currentJob.company.split(' ').map(w => w[0]).join('').substring(0, 2);
            document.getElementById('modalTitle').textContent = currentJob.title;
            document.getElementById('modalCompany').textContent = currentJob.company;
            document.getElementById('modalLocation').textContent = currentJob.location;
            document.getElementById('modalSalary').textContent = currentJob.salary;
            document.getElementById('modalType').textContent = currentJob.type;
            document.getElementById('modalDescription').textContent = currentJob.description;
            document.getElementById('modalRequirements').textContent = currentJob.requirements;
            
            const skillsContainer = document.getElementById('modalSkills');
            skillsContainer.innerHTML = (currentJob.skills || []).map(skill => 
                `<span class="modal-tag">${skill}</span>`
            ).join('');

            const isApplied = hasApplied(currentJob);
            const applyBtn = document.getElementById('modalApplyBtn');
            applyBtn.textContent = isApplied ? 'Already Applied' : 'Apply Now';
            applyBtn.className = isApplied ? 'btn btn-secondary' : 'btn btn-primary';
            applyBtn.onclick = () => toggleApplyByJob(currentJob);

            document.getElementById('jobModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('jobModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('jobModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function hasApplied(job) {
            const applications = JSON.parse(localStorage.getItem('applications') || '[]');
            return applications.some(app => 
                app.jobTitle === job.title && 
                app.company === job.company &&
                (app.studentEmail === studentProfile.email || app.studentEmail === studentProfile.email)
            );
        }

        function checkSaved(job) {
            const savedJobs = JSON.parse(localStorage.getItem('savedJobs') || '[]');
            return savedJobs.some(j => 
                j.title === job.title && 
                j.company === job.company &&
                (j.studentEmail === studentProfile.email || j.studentEmail === studentProfile.email)
            );
        }

        function toggleApply(index) {
            const jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const locationFilter = document.getElementById('locationFilter').value;
            
            let filtered = allJobs.filter(job => {
                const matchesSearch = !searchTerm || 
                    job.title.toLowerCase().includes(searchTerm) ||
                    job.company.toLowerCase().includes(searchTerm);
                const matchesLocation = !locationFilter || job.location === locationFilter;
                return matchesSearch && matchesLocation;
            });

            const job = filtered[index];
            
            if (Object.keys(studentProfile).length === 0 || !studentProfile.email) {
                showToast('Please complete your profile first', 'error');
                setTimeout(() => window.location.href = 'resume.html', 1500);
                return;
            }

            let applications = JSON.parse(localStorage.getItem('applications') || '[]');
            
            if (hasApplied(job)) {
                applications = applications.filter(app => 
                    !(app.jobTitle === job.title && app.company === job.company)
                );
                localStorage.setItem('applications', JSON.stringify(applications));
                showToast('Application removed');
            } else {
                applications.push({
                    jobTitle: job.title,
                    company: job.company,
                    location: job.location,
                    salary: job.salary,
                    type: job.type,
                    appliedAt: new Date().toISOString(),
                    studentName: studentProfile.name,
                    studentEmail: studentProfile.email,
                    studentPhone: studentProfile.phone,
                    studentAddress: studentProfile.address,
                    studentState: studentProfile.state,
                    studentQualification: studentProfile.qualification,
                    studentBranch: studentProfile.branch,
                    studentSkills: studentProfile.skills,
                    resumeName: studentProfile.resume,
                    resumeData: studentProfile.resumeData,
                    status: 'Under Review'
                });
                localStorage.setItem('applications', JSON.stringify(applications));
                showToast('Application submitted successfully!');
            }
            
            filterJobs();
        }

        function toggleApplyByJob(job) {
            const index = allJobs.findIndex(j => j.title === job.title && j.company === job.company);
            toggleApply(index);
            if (hasApplied(job)) {
                closeModal();
            }
        }

        function toggleSave(index) {
            const jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const locationFilter = document.getElementById('locationFilter').value;
            
            let filtered = allJobs.filter(job => {
                const matchesSearch = !searchTerm || 
                    job.title.toLowerCase().includes(searchTerm) ||
                    job.company.toLowerCase().includes(searchTerm);
                const matchesLocation = !locationFilter || job.location === locationFilter;
                return matchesSearch && matchesLocation;
            });

            const job = filtered[index];
            
            if (Object.keys(studentProfile).length === 0 || !studentProfile.email) {
                showToast('Please complete your profile first', 'error');
                setTimeout(() => window.location.href = 'resume.html', 1500);
                return;
            }

            let savedJobs = JSON.parse(localStorage.getItem('savedJobs') || '[]');
            
            if (checkSaved(job)) {
                savedJobs = savedJobs.filter(j => 
                    !(j.title === job.title && j.company === job.company)
                );
                localStorage.setItem('savedJobs', JSON.stringify(savedJobs));
                showToast('Job removed from saved');
            } else {
                savedJobs.push({...job, studentEmail: studentProfile.email});
                localStorage.setItem('savedJobs', JSON.stringify(savedJobs));
                showToast('Job saved successfully!');
            }
            
            filterJobs();
        }

        window.addEventListener('DOMContentLoaded', loadJobs);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
