<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobPortal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, var(--gray-900) 0%, #0a0a14 100%);
            position: relative;
            overflow: hidden;
        }

        .auth-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .auth-bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.2;
        }

        .auth-bg-glow-1 {
            top: -150px;
            left: -150px;
            background: var(--primary);
        }

        .auth-bg-glow-2 {
            bottom: -150px;
            right: -150px;
            background: var(--secondary);
        }

        .auth-card {
            background: var(--gray-800);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            position: relative;
            animation: cardFloat 0.6s ease forwards;
            transform: translateY(20px);
            opacity: 0;
            border: 1px solid var(--gray-700);
        }

        @keyframes cardFloat {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .auth-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #4338CA 100%);
            padding: 40px 40px 70px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%),
                linear-gradient(225deg, rgba(255,255,255,0.1) 0%, transparent 50%);
        }

        .auth-header::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 0;
            right: 0;
            height: 50px;
            background: var(--gray-800);
            border-radius: 50% 50% 0 0;
        }

        .auth-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            position: relative;
            z-index: 1;
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 15px 40px rgba(99, 102, 241, 0.5); }
        }

        .auth-logo svg {
            width: 36px;
            height: 36px;
            color: white;
        }

        .auth-header h1 {
            color: var(--white);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .auth-body {
            padding: 50px 40px 40px;
        }

        .user-type-toggle {
            display: flex;
            background: var(--gray-900);
            border-radius: var(--radius);
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--gray-700);
        }

        .user-type-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-400);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-type-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-500);
            cursor: pointer;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary-light);
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 24px;
        }

        .forgot-password a {
            font-size: 14px;
            color: var(--primary-light);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: var(--primary);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-700);
        }

        .auth-footer p {
            font-size: 14px;
            color: var(--gray-400);
        }

        .auth-footer a {
            color: var(--primary-light);
            font-weight: 600;
            position: relative;
        }

        .auth-footer a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .auth-footer a:hover::after {
            width: 100%;
        }

        .demo-accounts {
            background: var(--gray-900);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--gray-700);
        }

        .demo-accounts h4 {
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-400);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .demo-accounts h4 i {
            color: var(--primary);
        }

        .demo-account {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-700);
            font-size: 13px;
            transition: background 0.3s ease;
        }

        .demo-account:last-child {
            border-bottom: none;
        }

        .demo-account:hover {
            background: rgba(99, 102, 241, 0.05);
            margin: 0 -10px;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: var(--radius-sm);
        }

        .demo-account-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .demo-account-type {
            font-weight: 600;
            color: var(--gray-200);
        }

        .demo-account-creds {
            color: var(--gray-500);
            font-size: 12px;
        }

        .demo-btn {
            font-size: 11px;
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
        }

        .demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .error-message {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(220, 38, 38, 0.15) 100%);
            color: #fca5a5;
            padding: 14px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid var(--danger);
            animation: shakeError 0.5s ease;
        }

        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--gray-400);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
            transition: all 0.3s ease;
            padding: 8px 16px;
            background: var(--gray-800);
            border-radius: var(--radius);
            border: 1px solid var(--gray-700);
        }

        .back-home:hover {
            color: var(--primary-light);
            border-color: var(--primary);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <a href="home.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Back to Home
    </a>

    <div class="auth-page">
        <div class="auth-bg-glow auth-bg-glow-1"></div>
        <div class="auth-bg-glow auth-bg-glow-2"></div>
        
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to JobPortal</p>
            </div>
            
            <div class="auth-body">
                <div class="user-type-toggle">
                    <button class="user-type-btn active" data-type="student">
                        <i class="fas fa-user-graduate" style="margin-right: 6px;"></i> Student
                    </button>
                    <button class="user-type-btn" data-type="recruiter">
                        <i class="fas fa-building" style="margin-right: 6px;"></i> Recruiter
                    </button>
                </div>

                <div class="error-message" id="errorMessage" style="display: none;"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-envelope" style="margin-right: 6px; color: var(--primary-light);"></i>
                            Email Address
                        </label>
                        <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-lock" style="margin-right: 6px; color: var(--primary-light);"></i>
                            Password
                        </label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="password" placeholder="Enter your password" required style="padding-right: 44px;">
                            <button type="button" class="password-toggle" onclick="togglePassword()">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="submitBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Create one</a></p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="js/api.js"></script>
    <script>
        let selectedUserType = 'student';

        if (isLoggedIn()) {
            const user = getCurrentUser();
            if (user && user.user_type === 'student') {
                window.location.href = 'student.html';
            } else {
                window.location.href = 'recruiterdashboard.html';
            }
        }

        document.querySelectorAll('.user-type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.user-type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedUserType = this.dataset.type;
            });
        });

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading-spinner"></span> Signing in...';

            try {
                const response = await authAPI.login({ email, password, userType: selectedUserType });
                
                localStorage.setItem('token', response.data.token);
                localStorage.setItem('user', JSON.stringify(response.data.user));
                
                showToast('Login successful! Redirecting...', 'success');
                
                setTimeout(() => {
                    if (response.data.user.user_type === 'student') {
                        window.location.href = 'student.html';
                    } else {
                        window.location.href = 'recruiterdashboard.html';
                    }
                }, 1000);
            } catch (error) {
                errorMessage.textContent = error.message || 'Login failed. Please try again.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });
    </script>
</body>
</html>
