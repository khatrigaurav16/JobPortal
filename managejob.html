<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Jobs - JobPortal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, var(--gray-900) 0%, var(--primary-dark) 100%);
            padding: 40px 0;
            color: white;
        }
        .page-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .page-header p { opacity: 0.8; }
        .content-area { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
        .jobs-list { display: flex; flex-direction: column; gap: 20px; }
        .job-card { background: var(--gray-800); border-radius: var(--radius-xl); border: 1px solid var(--gray-700); overflow: hidden; transition: all 0.3s ease; }
        .job-card:hover { border-color: var(--primary); box-shadow: 0 10px 40px rgba(99, 102, 241, 0.15); }
        .job-card-header { padding: 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
        .job-title-section h3 { font-size: 18px; font-weight: 600; color: var(--white); margin-bottom: 4px; }
        .company-name { font-size: 14px; color: var(--gray-400); margin-bottom: 12px; }
        .job-meta { display: flex; flex-wrap: wrap; gap: 16px; }
        .meta-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gray-400); }
        .meta-item i { color: var(--gray-500); }
        .job-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .job-card-body { padding: 0 24px 24px; }
        .job-description { font-size: 14px; color: var(--gray-400); line-height: 1.6; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .applicants-info { background: var(--gray-700); padding: 12px 16px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; }
        .applicants-info span { font-size: 14px; color: var(--gray-300); }
        .btn-view-applicants { font-size: 13px; padding: 6px 12px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 20px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal { background: var(--gray-800); border-radius: var(--radius-xl); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; transform: scale(0.9); transition: transform 0.3s ease; border: 1px solid var(--gray-700); }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal-header { padding: 24px; border-bottom: 1px solid var(--gray-700); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 20px; font-weight: 600; color: var(--white); }
        .modal-close { width: 36px; height: 36px; border: none; background: var(--gray-700); border-radius: var(--radius); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--gray-300); transition: all 0.2s; }
        .modal-close:hover { background: var(--gray-600); color: var(--white); }
        .modal-body { padding: 24px; }
        .modal-footer { padding: 20px 24px; border-top: 1px solid var(--gray-700); display: flex; gap: 12px; justify-content: flex-end; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500; }
        .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-badge.closed { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        @media (max-width: 768px) { .job-card-header { flex-direction: column; } .job-actions { width: 100%; } .job-actions .btn { flex: 1; } }
    </style>
</head>
<body>
    <header class="nav-header">
        <div class="nav-container">
            <a href="home.html" class="nav-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                <span class="text-gradient">JobPortal</span>
            </a>
            <nav class="nav-links">
                <a href="recruiterdashboard.html" class="nav-link">Dashboard</a>
                <a href="addjob.html" class="nav-link">Post Jobs</a>
                <a href="managejob.html" class="nav-link" style="color: var(--primary-light);">Manage Jobs</a>
                <a href="view-applicants.html" class="nav-link">Applicants</a>
            </nav>
            <div class="nav-actions">
                <a href="recruiterdashboard.html" class="btn btn-secondary btn-sm">Back</a>
            </div>
        </div>
    </header>
    <div class="page-wrapper">
        <div class="page-header">
            <div class="container">
                <h1><i class="fas fa-briefcase"></i> Manage Your Jobs</h1>
                <p>Edit or delete your posted job listings</p>
            </div>
        </div>
        <div class="content-area">
            <div class="jobs-list" id="jobsList"></div>
        </div>
    </div>
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-edit" style="margin-right: 8px; color: var(--primary-light);"></i>Edit Job</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <div class="form-group">
                        <label class="form-label">Job Title</label>
                        <input type="text" class="form-input" id="editTitle" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-input" id="editCompany" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Location</label>
                            <select class="form-input form-select" id="editLocation" required>
                                <option value="Mumbai">Mumbai</option>
                                <option value="Bangalore">Bangalore</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Pune">Pune</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Kolkata">Kolkata</option>
                                <option value="Remote">Remote</option>
                                <option value="Work From Home">Work From Home</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Salary</label>
                            <input type="text" class="form-input" id="editSalary" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Job Type</label>
                            <select class="form-input form-select" id="editType" required>
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Internship">Internship</option>
                                <option value="Contract">Contract</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Experience</label>
                            <select class="form-input form-select" id="editExperience" required>
                                <option value="Fresher">Fresher</option>
                                <option value="0-1 years">0-1 years</option>
                                <option value="1-2 years">1-2 years</option>
                                <option value="2-5 years">2-5 years</option>
                                <option value="5+ years">5+ years</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-input form-select" id="editStatus" required>
                            <option value="active">Active</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" id="editDescription" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Requirements</label>
                        <textarea class="form-input" id="editRequirements" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Skills (comma separated)</label>
                        <input type="text" class="form-input" id="editSkills" required>
                    </div>
                    <input type="hidden" id="editJobId">
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveChanges()" id="saveBtn">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        let jobs = [];
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            
            if (!token) {
                window.location.href = 'login.html';
                return false;
            }
            
            if (user.user_type === 'student') {
                window.location.href = 'student.html';
                return false;
            }
            
            return true;
        }
        async function loadJobs() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/jobs/my-jobs', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.success) {
                    jobs = data.data;
                    renderJobs();
                } else {
                    showToast('Failed to load jobs', 'error');
                }
            } catch (error) {
                console.error('Error loading jobs:', error);
                showToast('Failed to load jobs', 'error');
            }
        }
        function renderJobs() {
            const list = document.getElementById('jobsList');
            
            if (jobs.length === 0) {
                list.innerHTML = `
                    <div class="empty-state" style="background: var(--gray-800); border-radius: var(--radius-xl); padding: 60px; text-align: center; border: 1px solid var(--gray-700);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--gray-600); margin: 0 auto 20px;">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                        <h3 style="color: var(--white); margin-bottom: 8px;">No jobs posted yet</h3>
                        <p style="color: var(--gray-400); margin-bottom: 20px;">Start by creating your first job listing</p>
                        <a href="addjob.html" class="btn btn-primary"><i class="fas fa-plus"></i> Post a Job</a>
                    </div>
                `;
                return;
            }
            list.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <div class="job-card-header">
                        <div class="job-title-section">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                                <h3>${job.title}</h3>
                                <span class="status-badge ${job.status}">
                                    <i class="fas fa-circle" style="font-size: 8px;"></i>
                                    ${job.status === 'active' ? 'Active' : 'Closed'}
                                </span>
                            </div>
                            <p class="company-name">${job.company}</p>
                            <div class="job-meta">
                                <span class="meta-item"><i class="fas fa-map-marker-alt"></i> ${job.location}</span>
                                <span class="meta-item"><i class="fas fa-briefcase"></i> ${job.job_type}</span>
                                <span class="meta-item"><i class="fas fa-indian-rupee-sign"></i> ${job.salary}</span>
                                <span class="meta-item"><i class="fas fa-clock"></i> ${job.experience}</span>
                            </div>
                        </div>
                        <div class="job-actions">
                            <button class="btn btn-secondary btn-sm" onclick="editJob('${job.id}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteJob('${job.id}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                    <div class="job-card-body">
                        <p class="job-description">${job.description}</p>
                        <div class="applicants-info">
                            <span><i class="fas fa-users" style="margin-right: 6px;"></i> ${job.application_count || 0} applicant${job.application_count !== 1 ? 's' : ''}</span>
                            <a href="view-applicants.html?jobId=${job.id}" class="btn btn-primary btn-view-applicants">
                                <i class="fas fa-eye"></i> View Applicants
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        function editJob(jobId) {
            const job = jobs.find(j => j.id == jobId);
            if (!job) return;
            
            document.getElementById('editJobId').value = job.id;
            document.getElementById('editTitle').value = job.title;
            document.getElementById('editCompany').value = job.company;
            document.getElementById('editLocation').value = job.location;
            document.getElementById('editSalary').value = job.salary;
            document.getElementById('editType').value = job.job_type;
            document.getElementById('editExperience').value = job.experience;
            document.getElementById('editDescription').value = job.description;
            document.getElementById('editRequirements').value = job.requirements;
            document.getElementById('editSkills').value = job.skills;
            document.getElementById('editStatus').value = job.status;
            
            document.getElementById('editModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
            document.body.style.overflow = '';
        }
        async function saveChanges() {
            const jobId = document.getElementById('editJobId').value;
            const saveBtn = document.getElementById('saveBtn');
            
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            
            const jobData = {
                title: document.getElementById('editTitle').value,
                company: document.getElementById('editCompany').value,
                location: document.getElementById('editLocation').value,
                salary: document.getElementById('editSalary').value,
                job_type: document.getElementById('editType').value,
                experience: document.getElementById('editExperience').value,
                description: document.getElementById('editDescription').value,
                requirements: document.getElementById('editRequirements').value,
                skills: document.getElementById('editSkills').value,
                status: document.getElementById('editStatus').value
            };
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/jobs/${jobId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(jobData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    closeModal();
                    loadJobs();
                    showToast('Job updated successfully!');
                } else {
                    showToast(data.message || 'Failed to update job', 'error');
                }
            } catch (error) {
                console.error('Error updating job:', error);
                showToast('Failed to update job', 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
            }
        }
        async function deleteJob(jobId) {
            if (!confirm('Are you sure you want to delete this job? This action cannot be undone.')) return;
            
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/jobs/${jobId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    loadJobs();
                    showToast('Job deleted successfully!');
                } else {
                    showToast(data.message || 'Failed to delete job', 'error');
                }
            } catch (error) {
                console.error('Error deleting job:', error);
                showToast('Failed to delete job', 'error');
            }
        }
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });
        if (checkAuth()) {
            window.addEventListener('DOMContentLoaded', loadJobs);
        }
    </script>
</body>
</html>
